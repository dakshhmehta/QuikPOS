name: Deploy QuikPOS PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: 'frontend/yarn.lock'

      - name: Install dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile

      - name: Build PWA
        working-directory: ./frontend
        env:
          EXPO_PUBLIC_BASE_PATH: /QuikPOS
        run: npx expo export -p web --clear

      - name: Prepare for GitHub Pages
        working-directory: ./frontend/dist
        run: |
          echo "📦 Preparing PWA build for GitHub Pages..."
          
          # Create .nojekyll to disable Jekyll processing (CRITICAL for _expo folder)
          touch .nojekyll
          echo "✅ .nojekyll created"
          
          # Fix asset paths for GitHub Pages subdirectory deployment
          echo "🔧 Fixing asset paths for /QuikPOS/ base URL..."
          find . -name "*.html" -type f -exec sed -i 's|href="/|href="/QuikPOS/|g; s|src="/|src="/QuikPOS/|g' {} \;
          echo "✅ HTML paths updated"
          
          # Verify critical folders exist
          if [ -d "_expo" ]; then
            echo "✅ _expo folder found"
            ls -la _expo/ | head -10
          else
            echo "❌ ERROR: _expo folder missing!"
            exit 1
          fi
          
          # Verify manifest and icons
          test -f manifest.json && echo "✅ manifest.json found" || echo "⚠️ manifest.json missing"
          test -f icon-192.png && echo "✅ icon-192.png found" || echo "⚠️ icon-192.png missing"
          test -f icon-512.png && echo "✅ icon-512.png found" || echo "⚠️ icon-512.png missing"
          
          # Show sample of fixed paths
          echo ""
          echo "📋 Sample of fixed paths in index.html:"
          grep -o 'src="[^"]*"' index.html | head -5
          grep -o 'href="[^"]*"' index.html | head -5
          
          # List all root files and directories
          echo ""
          echo "📁 Build contents:"
          ls -lah
          
          echo ""
          echo "🔍 Checking for underscore files/folders (must be included):"
          find . -maxdepth 2 -name "_*" -o -name ".*" | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "🎉 QuikPOS PWA deployed successfully!"
          echo "🌐 Live URL: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "📱 Install Instructions:"
          echo "- Desktop: Visit URL → Click install icon"
          echo "- iOS: Share → Add to Home Screen"
          echo "- Android: Menu → Install app"
