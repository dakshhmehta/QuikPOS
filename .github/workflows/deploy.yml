name: Deploy QuikPOS PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: 'frontend/yarn.lock'

      - name: Install dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile

      - name: Build PWA
        working-directory: ./frontend
        run: npx expo export -p web --clear

      - name: Ensure PWA assets
        working-directory: ./frontend/dist
        run: |
          # Create .nojekyll for GitHub Pages compatibility
          touch .nojekyll
          # Verify manifest.json exists
          test -f manifest.json && echo "✅ manifest.json found" || echo "⚠️ manifest.json missing"
          # Verify icons exist
          test -f icon-192.png && echo "✅ icon-192.png found" || echo "⚠️ icon-192.png missing"
          test -f icon-512.png && echo "✅ icon-512.png found" || echo "⚠️ icon-512.png missing"
          # List root files for verification
          echo "📦 Build contents:"
          ls -lah

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "🎉 QuikPOS PWA deployed successfully!"
          echo "🌐 Live URL: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "📱 Install Instructions:"
          echo "- Desktop: Visit URL → Click install icon"
          echo "- iOS: Share → Add to Home Screen"
          echo "- Android: Menu → Install app"
